<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mc-bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="mc-shine" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.14" />
    </linearGradient>
    <linearGradient id="mc-env" x1="32" y1="22" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="mc-spark" x1="44" y1="8.5" x2="54.5" y2="19.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <clipPath id="mc-env-clip">
      <rect x="13" y="22" width="38" height="25" rx="7.5" />
    </clipPath>
    <mask id="mc-spark-cutout">
      <rect width="64" height="64" fill="white" />
      <path
        d="M49.5 6.5 Q49.8 14.2 57.5 14.5 Q49.8 14.8 49.5 22.5 Q49.2 14.8 41.5 14.5 Q49.2 14.2 49.5 6.5 Z"
        fill="black"
      />
    </mask>
  </defs>

  <!-- Curved squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="24" fill="url(#mc-bg)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="23.5" stroke="url(#mc-shine)" stroke-width="1" />

  <!-- Centered curved envelope with crisp cutout around top-right spark -->
  <g mask="url(#mc-spark-cutout)">
    <rect x="13" y="22" width="38" height="25" rx="7.5" fill="url(#mc-env)" />

    <g clip-path="url(#mc-env-clip)">
      <path d="M13 47 Q32 33 51 47 Z" fill="#C7D2FE" fill-opacity="0.48" />
      <path
        d="M12 24.5 Q32 39.5 52 24.5"
        stroke="#4F46E5"
        stroke-width="3.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M16 44 Q20.5 40 24.5 36.5 M48 44 Q43.5 40 39.5 36.5"
        stroke="#818CF8"
        stroke-width="2"
        stroke-linecap="round"
        stroke-opacity="0.72"
      />
    </g>
  </g>

  <!-- Emerald 4-point craft spark -->
  <path
    d="M49.5 8.5 Q49.75 14.25 55.5 14.5 Q49.75 14.75 49.5 20.5 Q49.25 14.75 43.5 14.5 Q49.25 14.25 49.5 8.5 Z"
    fill="url(#mc-spark)"
  />
</svg>
